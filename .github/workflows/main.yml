name: Generate Profile Assets

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Generate metrics
    runs-on: ubuntu-latest
    steps:
      # Self-hosted stats/languages card (replaces the dead
      # github-profile-summary-cards / github-profile-trophy services).
      # committer_branch sends the render straight to `output`, so it
      # never touches `main`.
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          # Needs a classic PAT with the `repo` scope (authorized for SSO
          # on any org that enforces it) so private repos/orgs count
          # toward the languages plugin — the default GITHUB_TOKEN can
          # only see this one repository.
          token: ${{ secrets.METRICS_TOKEN }}
          user: YgorMendanha
          template: classic
          base: "header"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 12
          plugin_languages_threshold: 0%
          repositories_affiliations: owner, collaborator, organization_member
          config_animations: yes
          committer_branch: output
