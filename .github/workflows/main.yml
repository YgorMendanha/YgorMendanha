name: Generate Profile Assets

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Generate metrics
    runs-on: ubuntu-latest
    steps:
      # Self-hosted stats/languages card (replaces the dead
      # github-profile-summary-cards / github-profile-trophy services)
      - uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: YgorMendanha
          template: classic
          base: "header, activity, community, repositories"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 12
          plugin_languages_threshold: 0%
          config_animations: yes
          # Leave the file in the workspace only — our own deploy step
          # below pushes it to the `output` branch. Without this, the
          # action commits it directly to `main` on its own.
          output_action: none

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
