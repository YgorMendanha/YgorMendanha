name: Generate Profile Assets

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Generate snake animation and metrics
    runs-on: ubuntu-latest
    steps:
      # Snake Animation
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: YgorMendanha
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Self-hosted stats/languages card (replaces the dead
      # github-profile-summary-cards / github-profile-trophy services)
      - uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: YgorMendanha
          template: classic
          base: "header, activity, community, repositories"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 12
          plugin_languages_threshold: 0%

      # Both files above land in dist/ and get pushed together so
      # this step doesn't force-push over the other's output.
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
