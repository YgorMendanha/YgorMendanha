name: Generate Profile Assets

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Generate stats cards
    runs-on: ubuntu-latest
    steps:
      # Self-hosted github-readme-stats cards (the public vercel.app
      # instance is dead). Same midnight-purple theme as the streak
      # stats card below, so the two match visually. Needs
      # METRICS_TOKEN (classic PAT, repo scope) to see private repos.
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=YgorMendanha&theme=midnight-purple&hide_border=true&show_icons=true&count_private=true&include_all_commits=true&hide_rank=true
          path: dist/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=YgorMendanha&theme=midnight-purple&hide_border=true&layout=compact&count_private=true
          path: dist/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
